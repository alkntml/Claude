/* Zamanlama */
const INTRO = 1.4, PER = 3.4, TAIL = 3.0, XF = 0.6;
function durOf(s) {
  if (s.type === "title") return 7;
  const n = s.bullets ? s.bullets.length : s.layers ? s.layers.length : (s.cards || s.grid).length;
  const per = s.layers ? 3.6 : s.bullets ? PER : (s.grid ? 0.25 : 1.6);
  return INTRO + n * per + TAIL + (s.grid ? 4 : 0);
}
let acc = 0; const T = S.map((s) => { const a = acc; acc += durOf(s); return [a, acc]; });
window.DURATION = acc; window.T = T;

      : s.cards.map(([a, b, tag]) => { const c = { "YOK": "background:#fff1f2;color:#be123c", "SINIRLI": "background:#fef3c7;color:#92400e", "BİLGİ": "background:#eef2ff;color:#4338ca", "KİŞİ BAZLI": "background:#fef3c7;color:#92400e", "AYAR": "background:#eef2ff;color:#4338ca", "İÇERİK": "background:#ecfdf5;color:#047857", "SAYILAR": "background:#ecfdf5;color:#047857", "ANONİM": "background:#ecfdf5;color:#047857", "TEKNİK": "background:#f4f5f9;color:#3d4258", "SİZİN VERİNİZ": "background:#ecfdf5;color:#047857" }[tag]; return `<div class="gcard" ${s.dark ? 'style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)"' : ""}><b ${s.dark ? 'style="color:#fff"' : ""}>${a}</b><p ${s.dark ? 'style="color:rgba(255,255,255,.7)"' : ""}>${b}</p><span class="tag" style="${c}">${tag}</span></div>`; }).join("");

      <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:16px;margin-top:36px">${items}</div></div>`;
  } else {
    const list = s.bullets

      : "";
    const layers = s.layers ? `<div style="margin-top:20px">${s.layers.map(([bg, fg, b, p], j) => `<div class="layer" style="background:${bg};color:${fg};margin-left:${j * 28}px"><span style="font-size:26px;font-weight:800;width:36px">${j + 1}</span><div><b>${b}</b><p>${p}</p></div></div>`).join("")}</div>` : "";

function render(t) {

    const per = s.layers ? 3.6 : s.bullets ? PER : (s.grid ? 0.25 : 1.6);
    el.querySelectorAll(".bu, .gcard, .layer").forEach((x, j) => fade(x, eo(pr(L, INTRO + j * per - 0.2, INTRO + j * per + 0.5)), 16));
    const box = el.querySelector(".box"); if (box) fade(box, eo(pr(L, 0.5, 1.3)), 30);

}

else if (!q.has("rec")) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % acc); requestAnimationFrame(loop); }; loop(); }
